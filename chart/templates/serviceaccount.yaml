{{- range $key, $config := .Values.security.serviceAccount }}
{{- with mergeOverwrite (deepCopy $config) (dict "name" $key) }}
{{- if .enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "template-service.metadata" (dict "root" $ "item" .) | nindent 2 }}

automountServiceAccountToken: {{ .automountServiceAccountToken | default false }}
{{- end }}
{{- end }}
{{- end }}
