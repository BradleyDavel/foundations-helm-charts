{{- range $key, $config := .Values.storage.persistentVolumeClaims }}
{{- with mergeOverwrite (deepCopy $config) (dict "name" $key) }}
{{- if .enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- include "template-service.metadata" (dict "root" $ "item" .) | nindent 2 }}

spec:
  accessModes:
    {{- toYaml .accessModes | nindent 4 }}
  {{- if hasKey . "storageClassName" }}
  storageClassName: {{ .storageClassName | quote }}
  {{- end }}
  {{- with .volumeMode }}
  volumeMode: {{ . }}
  {{- end }}
  {{- with .selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .storage | quote }}
{{- end }}
{{- end }}
{{- end }}
