{{- range $key, $config := .Values.security.roleBinding }}
{{- with mergeOverwrite (deepCopy $config) (dict "name" $key) }}
{{- if .enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "template-service.metadata" (dict "root" $ "item" . "clusterScoped" false) | nindent 2 }}
{{ include "template-service.binding" (dict "root" $ "item" .) }}
{{- end }}
{{- end }}
{{- end }}
