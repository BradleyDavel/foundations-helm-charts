{{- range $key, $config := .Values.security.role }}
{{- with mergeOverwrite (deepCopy $config) (dict "name" $key) }}
{{- if .enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "template-service.metadata" (dict "root" $ "item" . "clusterScoped" false) | nindent 2 }}
rules:
  {{- toYaml .rules | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
