{{- range $key, $config := .Values.config.externalSecrets }}
{{- with mergeOverwrite (deepCopy $config) (dict "name" $key) }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  {{- include "template-service.metadata" (dict "root" $ "item" .) | nindent 2 }}

spec:
  refreshInterval: {{ .refreshInterval | default "15s" | quote }}
  {{- with .secretStoreRef }}
  secretStoreRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  target:
    name: {{ .targetName | default (include "template-service.resourceName" (dict "root" $ "item" .)) }}
    creationPolicy: {{ .creationPolicy | default "Owner" }}
    {{- with .template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
